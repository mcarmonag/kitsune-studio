@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13111D;--surface:#1C1929;--ink:#ECE9F6;--muted:#A7A2BD;--line:#2F2B42;--wash:#221E33;
  --fox:#E39A6B;--foxfire:#A797FF;
  --ban:#F97066;--ban-wash:#3A1A1C;--high:#F5A44A;--high-wash:#3A2614;
  --limited:#A797FF;--limited-wash:#272143;--minimal:#5FCB8F;--minimal-wash:#16301F;--off:#2A263A;
  --logo-grad:linear-gradient(to bottom left,#F6CDAE,#E39A6B 55%,#C9774A);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13111D;--surface:#1C1929;--ink:#ECE9F6;--muted:#A7A2BD;--line:#2F2B42;--wash:#221E33;
  --fox:#E39A6B;--foxfire:#A797FF;
  --ban:#F97066;--ban-wash:#3A1A1C;--high:#F5A44A;--high-wash:#3A2614;
  --limited:#A797FF;--limited-wash:#272143;--minimal:#5FCB8F;--minimal-wash:#16301F;--off:#2A263A;
  --logo-grad:linear-gradient(to bottom left,#F6CDAE,#E39A6B 55%,#C9774A);color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--foxfire);outline-offset:3px;border-radius:2px}
.wrap{max-width:74rem;margin:0 auto;padding-inline:clamp(1rem,4vw,2.5rem)}
h1,h2,h3{font-family:var(--display);font-weight:800;text-wrap:balance;margin:0;line-height:1.1}
p{margin:0}
.label{font:500 .75rem/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--foxfire)}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-block:.85rem}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;font:600 1rem/1 var(--body)}
.logo{display:block;width:2.2rem;aspect-ratio:192/223;background:var(--logo-grad);-webkit-mask:var(--mini-mask) center/contain no-repeat;mask:var(--mini-mask) center/contain no-repeat}
.right{display:flex;align-items:center;gap:1.25rem}
.back{font-size:.92rem;color:var(--muted);text-decoration:none}
.back:hover{color:var(--ink)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px}
.lang button{all:unset;cursor:pointer;font:500 .75rem/1 var(--mono);letter-spacing:.06em;padding:.4rem .6rem;border-radius:999px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
@media (max-width:560px){.back{display:none}}

.intro{padding-block:clamp(2.5rem,6vw,4rem) 1.5rem;display:grid;gap:1rem;max-width:52rem}
.intro h1{font-size:clamp(2.2rem,5.5vw,3.6rem);letter-spacing:-.015em}
.intro .lead{font-size:clamp(1.05rem,1.5vw,1.2rem);color:var(--muted);max-width:62ch}
.disclaimer{font-size:.88rem;color:var(--muted);border-left:3px solid var(--fox);padding-left:.8rem;max-width:62ch}

.examples{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;padding-block:1rem 2rem}
.examples span.lbl{font-size:.9rem;color:var(--muted);margin-right:.25rem}
.chip{all:unset;cursor:pointer;font-size:.88rem;padding:.45rem .85rem;border:1px solid var(--line);border-radius:999px;background:var(--surface);transition:border-color .15s}
.chip:hover{border-color:var(--fox)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.reset{background:transparent;border-style:dashed}
.chip:focus-visible{outline:2px solid var(--foxfire);outline-offset:2px}

.tool{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(1.5rem,4vw,3rem);align-items:start;padding-bottom:4rem}
@media (max-width:900px){.tool{grid-template-columns:1fr}}
form{display:grid;gap:1.25rem;min-width:0}
fieldset{margin:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:1.25rem 1.25rem 1.1rem;display:grid;gap:.75rem;min-width:0}
legend{display:contents}
.step-head{display:flex;gap:.8rem;align-items:baseline}
.num{flex:none;font:500 .8rem/1 var(--mono);color:var(--fox);border:1px solid currentColor;border-radius:999px;width:1.7rem;height:1.7rem;display:grid;place-items:center;transform:translateY(-2px)}
.step-head h2{font-size:1.25rem;line-height:1.25}
.hint{font-size:.92rem;color:var(--muted);padding-left:2.5rem}
.opts{display:grid;gap:.4rem;padding-left:2.5rem}
.opt{display:flex;gap:.7rem;align-items:flex-start;padding:.55rem .7rem;border-radius:4px;cursor:pointer;border:1px solid transparent;transition:background .15s,border-color .15s}
.opt:hover{background:var(--wash)}
.opt:has(input:checked){background:var(--wash);border-color:var(--line)}
.opt input{flex:none;margin:.25rem 0 0;width:1.05rem;height:1.05rem;accent-color:var(--fox)}
.opt span{min-width:0;font-size:.97rem}
.opt small{display:block;color:var(--muted);font-size:.85rem;margin-top:.1rem}
.inline{display:flex;flex-wrap:wrap;gap:.4rem}
.inline .opt{border-color:var(--line)}
@media (max-width:560px){.hint,.opts{padding-left:0}}

.result{position:sticky;top:5.5rem;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1.4rem;display:grid;gap:1.1rem;min-width:0}
@media (max-width:900px){.result{position:static}}
.result-top{display:flex;flex-wrap:wrap;gap:1.1rem 1.4rem;align-items:center}
.pyr{width:11rem;height:auto;flex:none}
.pyr path{fill:var(--off);transition:fill .2s}
.pyr text{font:500 9px/1 var(--mono);letter-spacing:.04em;fill:var(--muted)}
.pyr .on{font-weight:600}
.pyr .ban.on{fill:var(--ban)}.pyr .high.on{fill:var(--high)}.pyr .limited.on{fill:var(--limited)}.pyr .minimal.on{fill:var(--minimal)}
.pill{justify-self:start;display:inline-block;font:600 .75rem/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:.4rem .6rem;border-radius:3px}
.lv-ban .pill{background:var(--ban-wash);color:var(--ban)}
.lv-high .pill{background:var(--high-wash);color:var(--high)}
.lv-limited .pill{background:var(--limited-wash);color:var(--limited)}
.lv-minimal .pill{background:var(--minimal-wash);color:var(--minimal)}
.lv-none .pill{background:var(--wash);color:var(--muted)}
.verdict{display:grid;gap:.45rem;flex:1 1 12rem;min-width:0}
.verdict h2{font-size:1.65rem}
.verdict p{color:var(--muted);font-size:.95rem}
.result h3{font:600 .75rem/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:.45rem}
.result ul{list-style:none;margin:0;padding:0;display:grid;gap:.45rem}
.result li{font-size:.94rem;display:flex;gap:.55rem;align-items:baseline}
.result li::before{content:"";flex:none;width:.4rem;height:.4rem;background:var(--fox);transform:rotate(45deg) translateY(-2px)}
.who{flex:none;font:500 .66rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:.25rem .35rem;border-radius:2px;background:var(--wash);color:var(--muted)}
.result li > span:last-child{min-width:0}
.note{font-size:.88rem;color:var(--muted);background:var(--wash);border-radius:4px;padding:.7rem .8rem}
.actions{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;border-top:1px solid var(--line);padding-top:1rem}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:.4rem;font:600 .9rem/1 var(--body);padding:.7rem 1rem;border-radius:3px;background:var(--ink);color:var(--bg)}
.btn:focus-visible{outline:2px solid var(--foxfire);outline-offset:2px}
.copied{font-size:.85rem;color:var(--minimal)}
.empty{color:var(--muted);font-size:.95rem}

.mbar{display:none}
@media (max-width:900px){
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:9;justify-content:space-between;align-items:center;gap:1rem;padding:.75rem 1rem calc(.75rem + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);text-decoration:none}
  .mbar b{font-family:var(--display)}
  body{padding-bottom:4rem}
}
.mbar .pill{font-size:.68rem}

.sources{border-top:1px solid var(--line);padding-block:2rem 3rem;display:grid;gap:.6rem;font-size:.9rem;color:var(--muted)}
.sources a{color:var(--ink);text-underline-offset:3px}
footer{padding-block:1.5rem;font:400 .8rem/1.5 var(--mono);color:var(--muted);border-top:1px solid var(--line)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:1rem}
</style>

    q.o.forEach(function(o){
      var id=q.id+'-'+o.id,checked=q.type==='radio'?st[q.id]===o.id:!!st[q.id][o.id];
      h+='<label class="opt" for="'+id+'"><input type="'+(q.type==='radio'?'radio':'checkbox')+'" id="'+id+'" name="'+q.id+'" value="'+o.id+'"'+(checked?' checked':'')+'><span>'+esc(tr(o.t))+(o.sm?'<small>'+esc(tr(o.sm))+'</small>':'')+'</span></label>';
    });
    h+='</div></fieldset>';
  });
  f.innerHTML=h;
}
function short(qid,oid){var q=S.filter(function(x){return x.id===qid;})[0];var o=q.o.filter(function(x){return x.id===oid;})[0];return tr(o.s||o.t);}
function keys(o){return Object.keys(o).filter(function(k){return o[k];});}

function classify(s){
  var es=L==='es',r={level:'none',reasons:[],todo:[],when:[],notes:[]};
  var answered=s.role||any(s.p)||s.annex1||any(s.a)||any(s.t);
  if(!answered)return r;
  var role=s.role;
  function add(who,es_,en_){if(who==='all'||!role||role===who)r.todo.push({who:who,t:es?es_:en_});}
  var lit=function(){add('all','Alfabetización en IA: tomar medidas para que tu equipo entienda la IA que usa (art. 4).','AI literacy: take measures so your staff understand the AI they use (Art. 4).');};
  if(any(s.p)){
    r.level='ban';
    keys(s.p).forEach(function(k){r.reasons.push(short('p',k));});
    add('all','No puedes comercializarlo ni usarlo en la UE.','You cannot place it on the market or use it in the EU.');
    add('all','Multas de hasta 35 millones de euros o el 7 % de la facturación mundial.','Fines of up to €35 million or 7% of worldwide turnover.');
    var only=keys(s.p).length===1&&s.p.p_ncii;
    if(!only)r.when.push(es?'Prohibiciones en vigor desde el 2 de febrero de 2025':'Prohibitions in force since 2 February 2025');
    if(s.p.p_ncii)r.when.push(es?'Prohibición de imágenes íntimas no consentidas y CSAM: desde el 2 de diciembre de 2026':'Ban on non-consensual intimate imagery and CSAM: from 2 December 2026');
    return r;
  }
  var high=false,exception=false;
  if(s.annex1==='yes'){high=true;r.reasons.push(es?'Componente de seguridad de un producto regulado (anexo I)':'Safety component of a regulated product (Annex I)');r.when.push(es?'Requisitos de alto riesgo para productos regulados: desde el 2 de agosto de 2028':'High-risk requirements for regulated products: from 2 August 2028');}
  if(any(s.a)){
    var areas=keys(s.a).map(function(k){return short('a',k);}).join(', ');
    if(s.prof==='yes'||!any(s.x)){
      high=true;
      r.reasons.push((es?'Área de alto riesgo (anexo III): ':'High-risk area (Annex III): ')+areas);
      if(s.prof==='yes')r.reasons.push(es?'Elabora perfiles de personas, así que no puede acogerse a la excepción':'It profiles people, so the exception cannot apply');
      r.when.push(es?'Requisitos de alto riesgo del anexo III: desde el 2 de diciembre de 2027 (aplazados desde agosto de 2026 por el Reglamento 2026/1744)':'Annex III high-risk requirements: from 2 December 2027 (postponed from August 2026 by Regulation 2026/1744)');
      if(s.prof===null)r.notes.push(es?'Responde si elabora perfiles (paso 4a): podría cambiar el resultado.':'Answer whether it profiles people (step 4a): it could change the result.');
    }else{
      exception=true;
      r.reasons.push((es?'Área del anexo III ('+areas+'), pero con un papel solo de apoyo: ':'Annex III area ('+areas+'), but only a supporting role: ')+keys(s.x).map(function(k){return short('x',k);}).join(', '));
      r.notes.push(es?'Excepción del artículo 6.3: documenta por qué no es de alto riesgo antes de comercializarlo o usarlo, y tenlo disponible para las autoridades.':'Article 6(3) exception: document why it is not high-risk before placing it on the market or using it, and keep it available for the authorities.');
    }
  }
  if(high){
    r.level='high';
    add('provider','Sistema de gestión de riesgos durante todo el ciclo de vida.','Risk management system across the whole lifecycle.');
    add('provider','Datos de entrenamiento de calidad, pertinentes y revisados para detectar sesgos.','High-quality, relevant training data, checked for bias.');
    add('provider','Documentación técnica y registro automático de eventos (logs).','Technical documentation and automatic event logging.');
    add('provider','Instrucciones de uso claras y diseño que permita la supervisión humana.','Clear instructions for use and a design that allows human oversight.');
    add('provider','Precisión, robustez y ciberseguridad adecuadas.','Appropriate accuracy, robustness and cybersecurity.');
    add('provider','Sistema de gestión de calidad, evaluación de conformidad, marcado CE y registro en la base de datos de la UE.','Quality management system, conformity assessment, CE marking and registration in the EU database.');
    add('provider','Vigilancia poscomercialización y notificación de incidentes graves.','Post-market monitoring and reporting of serious incidents.');
    add('deployer','Usarlo siguiendo las instrucciones del proveedor.','Use it according to the provider\'s instructions.');
    add('deployer','Asignar supervisión humana a personas con formación y autoridad.','Assign human oversight to trained people with authority.');
    add('deployer','Vigilar su funcionamiento y conservar los logs al menos seis meses.','Monitor its operation and keep logs for at least six months.');
    add('deployer','Informar a la plantilla antes de usarlo en el trabajo, y a las personas sobre las que decide o ayuda a decidir.','Inform staff before using it at work, and inform the people it makes or helps make decisions about.');
    add('deployer','Evaluación de impacto en derechos fundamentales si eres un organismo público, prestas servicios públicos o lo usas para crédito o seguros de vida y salud.','Fundamental rights impact assessment if you are a public body, provide public services, or use it for credit or life and health insurance.');
    add('all','Multas de hasta 15 millones de euros o el 3 % de la facturación mundial por incumplimiento.','Fines of up to €15 million or 3% of worldwide turnover for non-compliance.');
  }
  if(any(s.t)){
    if(!high)r.level='limited';
    keys(s.t).forEach(function(k){r.reasons.push(short('t',k));});
    if(s.t.t_chat)add('provider','Informar a las personas de que están hablando con una IA, salvo que sea evidente.','Tell people they are interacting with an AI, unless it is obvious.');
    if(s.t.t_gen)add('provider','Marcar el contenido generado en un formato legible por máquina para que se pueda detectar.','Mark generated content in a machine-readable format so it can be detected.');
    if(s.t.t_deep)add('deployer','Indicar claramente que el contenido ha sido generado o manipulado con IA.','Clearly disclose that the content was generated or manipulated with AI.');
    if(s.t.t_emo)add('deployer','Informar a las personas expuestas al reconocimiento de emociones o a la categorización biométrica.','Inform people exposed to emotion recognition or biometric categorisation.');
    if(s.t.t_text)add('deployer','Indicar que el texto es generado por IA, salvo que haya revisión humana y responsabilidad editorial.','Disclose that the text is AI-generated, unless there is human review and editorial responsibility.');
    r.when.push(es?'Obligaciones de transparencia: desde el 2 de agosto de 2026':'Transparency obligations: from 2 August 2026');
    if(s.t.t_gen)r.when.push(es?'Marcado de contenido en sistemas generativos ya comercializados antes del 2 de agosto de 2026: hasta el 2 de diciembre de 2026':'Content marking for generative systems already on the market before 2 August 2026: by 2 December 2026');
  }
  if(r.level==='none'){
    r.level='minimal';
    r.reasons.push(exception?(es?'Su papel en el área de alto riesgo es solo de apoyo y no hay obligaciones de transparencia':'Its role in the high-risk area is only supportive and there are no transparency obligations'):(es?'No has marcado prácticas prohibidas, productos regulados, áreas de alto riesgo ni casos de transparencia':'You have not ticked prohibited practices, regulated products, high-risk areas or transparency cases'));
    add('all','Sin obligaciones específicas. Puedes adherirte a códigos de conducta voluntarios.','No specific obligations. You can follow voluntary codes of conduct.');
  }
  lit();
  r.when.push(es?'Alfabetización en IA: desde el 2 de febrero de 2025':'AI literacy: since 2 February 2025');
  if(!role)r.notes.push(es?'Elige tu papel en el paso 1 para ver solo las obligaciones que te tocan.':'Pick your role in step 1 to see only the obligations that apply to you.');
  return r;
}
var LV={
  ban:{es:['Prohibido','Práctica prohibida','No se puede comercializar ni utilizar en la UE.'],en:['Prohibited','Prohibited practice','It cannot be placed on the market or used in the EU.']},
  high:{es:['Alto riesgo','Alto riesgo','Permitido, pero con requisitos estrictos antes y durante su uso.'],en:['High risk','High risk','Allowed, but with strict requirements before and during use.']},
  limited:{es:['Riesgo limitado','Riesgo limitado','Permitido, con obligaciones de transparencia.'],en:['Limited risk','Limited risk','Allowed, with transparency obligations.']},
  minimal:{es:['Riesgo mínimo','Riesgo mínimo','Permitido sin obligaciones específicas del Reglamento.'],en:['Minimal risk','Minimal risk','Allowed with no specific obligations under the Act.']}
};
var PYR=[['ban','M40 2 L52 26 H28 Z',18,{es:'Inaceptable',en:'Unacceptable'}],['high','M27 29 H53 L65 53 H15 Z',45,{es:'Alto',en:'High'}],['limited','M14 56 H66 L78 80 H2 Z',72,{es:'Limitado',en:'Limited'}],['minimal','M1 83 H79 L80 106 H0 Z',98,{es:'Mínimo',en:'Minimal'}]];
function pyramid(level){
  var h='<svg class="pyr" viewBox="0 0 160 108" aria-hidden="true">';
  PYR.forEach(function(p){var on=p[0]===level?' on':'';h+='<path class="'+p[0]+on+'" d="'+p[1]+'"/><text x="90" y="'+p[2]+'" class="'+p[0]+on+'">'+p[3][L]+'</text>';});
  return h+'</svg>';
}
var lastSummary='';
function renderResult(){
  var r=classify(st),box=document.getElementById('resultado'),mb=document.getElementById('mbar');
  if(r.level==='none'){
    box.className='result lv-none';
    box.innerHTML='<p class="label">'+T.result[L]+'</p><div class="result-top">'+pyramid('none')+'<div class="verdict"><span class="pill">'+T.emptyH[L]+'</span><p class="empty">'+T.emptyP[L]+'</p></div></div>';
    mb.innerHTML='<span>'+T.result[L]+'</span><span class="pill" style="background:var(--wash);color:var(--muted)">'+T.emptyH[L]+'</span>';
    lastSummary='';return;
  }
  var lv=LV[r.level][L],h='<p class="label">'+T.result[L]+'</p><div class="result-top">'+pyramid(r.level)+'<div class="verdict"><span class="pill">'+lv[0]+'</span><h2>'+lv[1]+'</h2><p>'+lv[2]+'</p></div></div>';
  h+='<div><h3>'+T.why[L]+'</h3><ul>'+r.reasons.map(function(x){return'<li><span>'+esc(x)+'</span></li>';}).join('')+'</ul></div>';
  h+='<div><h3>'+T.todo[L]+'</h3><ul>'+r.todo.map(function(x){return'<li><span class="who">'+T[x.who][L]+'</span><span>'+esc(x.t)+'</span></li>';}).join('')+'</ul></div>';
  h+='<div><h3>'+T.when[L]+'</h3><ul>'+r.when.map(function(x){return'<li><span>'+esc(x)+'</span></li>';}).join('')+'</ul></div>';
  r.notes.forEach(function(n){h+='<p class="note">'+esc(n)+'</p>';});
  h+='<div class="actions"><button type="button" class="btn" id="copy">'+T.copy[L]+'</button><span class="copied" id="copied" hidden>'+T.copied[L]+'</span></div>';
  box.className='result lv-'+r.level;box.innerHTML=h;
  mb.className='mbar lv-'+r.level;mb.innerHTML='<span>'+T.result[L]+': <b>'+lv[1]+'</b></span><span class="pill">'+lv[0]+'</span>';
  var ex=EX.filter(function(e){return e.id===current;})[0];
  lastSummary=(L==='es'?'Clasificación EU AI Act':'EU AI Act classification')+(ex?' — '+tr(ex.t):'')+'\n'+lv[1]+': '+lv[2]+'\n\n'+T.why[L]+':\n- '+r.reasons.join('\n- ')+'\n\n'+T.todo[L]+':\n- '+r.todo.map(function(x){return'['+T[x.who][L]+'] '+x.t;}).join('\n- ')+'\n\n'+T.when[L]+':\n- '+r.when.join('\n- ')+'\n\n'+(L==='es'?'Demo educativa, no es asesoramiento legal. kitsune-studio.eu/eu-ai-act':'Educational demo, not legal advice. kitsune-studio.eu/eu-ai-act');
  document.getElementById('copy').addEventListener('click',function(){
    var ok=function(){var c=document.getElementById('copied');c.hidden=false;setTimeout(function(){c.hidden=true;},1800);};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(lastSummary).then(ok,function(){});
  });
}
function readForm(){
  var s=blank();
  S.forEach(function(q){
    document.querySelectorAll('input[name="'+q.id+'"]').forEach(function(i){
      if(!i.checked)return;
      if(q.type==='radio')s[q.id]=i.value;else s[q.id][i.value]=1;
    });
  });
  if(!any(s.a)){s.prof=null;s.x={};}
  if(s.prof==='yes')s.x={};
  return s;
}
function syncDeps(){
  S.forEach(function(q){if(!q.dep)return;var hide=!any(st[q.dep])||(q.hideIf==='profYes'&&st.prof==='yes');document.getElementById('q-'+q.id).hidden=hide;});
}
function setLang(l){
  L=l;document.documentElement.lang=l;
  document.querySelectorAll('.lang button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.set===l));});
  try{localStorage.setItem('ks-lang',l);}catch(e){}
  renderStatic();renderForm();renderResult();
}
document.getElementById('f').addEventListener('change',function(){st=readForm();current=null;syncDeps();renderStatic();renderResult();});
document.getElementById('examples').addEventListener('click',function(e){
  var b=e.target.closest('[data-ex]');if(!b)return;
  var ex=EX.filter(function(x){return x.id===b.dataset.ex;})[0];
  st=ex?load(ex):blank();current=ex?ex.id:null;
  renderStatic();renderForm();renderResult();
});
document.querySelectorAll('.lang button').forEach(function(b){b.addEventListener('click',function(){setLang(b.dataset.set);});});
var saved=null;try{saved=localStorage.getItem('ks-lang');}catch(e){}
st=load(EX[0]);current=EX[0].id;
setLang(saved||((navigator.language||'es').slice(0,2)==='es'?'es':'en'));
})();
</script>
